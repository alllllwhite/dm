<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Director's MGR" />
    <meta name="theme-color" content="#0E0D12" />
    <title>Director's Manager</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0E0D12;
        overscroll-behavior: none;
      }
      #root {
        min-height: 100%;
        min-height: 100dvh;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0E0D12;
        transition: opacity 0.5s ease;
      }
      #splash.splash-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-mark {
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      #splash .splash-word {
        font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
        font-weight: 800;
        font-size: 14px;
        letter-spacing: 2px;
        color: #F4F2F0;
      }
      #splash .splash-word span { color: #C9FF3C; }
      #splash .splash-dots {
        display: flex;
        gap: 5px;
        margin-top: 2px;
      }
      #splash .splash-dots i {
        width: 5px;
        height: 5px;
        border-radius: 5px;
        background: #4A4851;
        display: inline-block;
        animation: splash-dot 1.1s ease-in-out infinite;
      }
      #splash .splash-dots i:nth-child(2) { animation-delay: 0.15s; }
      #splash .splash-dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.07); opacity: 0.88; }
      }
      @keyframes splash-dot {
        0%, 100% { background: #4A4851; transform: scale(1); }
        50% { background: #C9FF3C; transform: scale(1.3); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg class="splash-mark" width="68" height="68" viewBox="0 0 100 100" fill="none">
        <rect width="100" height="100" rx="22" fill="#17161B" />
        <path d="M18 30 V18 H30" stroke="#C9FF3C" stroke-width="5" stroke-linecap="round" />
        <path d="M70 18 H82 V30" stroke="#C9FF3C" stroke-width="5" stroke-linecap="round" />
        <path d="M18 70 V82 H30" stroke="#C9FF3C" stroke-width="5" stroke-linecap="round" />
        <path d="M82 70 V82 H70" stroke="#C9FF3C" stroke-width="5" stroke-linecap="round" />
        <text x="50" y="63" font-family="system-ui" font-weight="800" font-size="32" fill="#F4F2F0" text-anchor="middle">DM</text>
      </svg>
      <div class="splash-word">DIRECTOR'S <span>MANAGER</span></div>
      <div class="splash-dots"><i></i><i></i><i></i></div>
    </div>
    <div id="root"></div>
